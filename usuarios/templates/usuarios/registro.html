{% extends 'base.html' %}

{% block contenido %}
{% load widget_tweaks %}
<div class="container mt-5 pt-5 d-flex justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 400px; background-color: #f8f9fa; border-radius: 15px;">
        <h2 class="text-center mb-3" style="color: #1B3B1A;">Registro</h2>
        <form action={% url "registro" %} method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">{{ form.username.label }}</label>
                {{ form.username|add_class:"form-control" }}
            </div>
            <div class="mb-3">
                <label for="{{ form.password1.id_for_label }}" class="form-label">{{ form.password1.label }}</label>
                {{ form.password1|add_class:"form-control" }}
            </div>
            <div class="mb-3">
                <label for="{{ form.password2.id_for_label }}" class="form-label">{{ form.password2.label }}</label>
                {{ form.password2|add_class:"form-control" }}
            </div>
            
            <div class="text-center">
                <input type="submit" class="btn btn-success w-100" value="Registrarse">
            </div>
        </form>
    </div>
</div>
{% endblock contenido %}
