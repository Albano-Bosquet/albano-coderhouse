{% extends 'base.html' %}

{% block contenido %}
<div class="container d-flex justify-content-between align-items-center" style="height: 72vh;">
    <!-- Columna de la imagen -->
    <div class="col-md-4" style="background: url('/media/plantas/hojas.png') no-repeat center center/cover; height: 110%; -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 30%, rgba(0, 0, 0, 0) 80%); mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 30%, rgba(0, 0, 0, 0) 80%); background-size: cover;"></div>
    
    <!-- Columna del formulario -->
    <div class="flex-fill" style="max-height: 80vh; overflow: auto; z-index: 2; padding: 20px;">
        <div class="main-content" style="width: 100%; max-width: 2000px; margin: 0 auto;">
            <div class="form-container text-center">
                <h3 class="text-success font-weight-bold mb-4" style="font-family: 'Roboto', sans-serif; font-size: 2rem;">PLATAFORMA DE GESTION DE PLANTAS DE CANNABIS</h3>
                
                <h6 class="text-primary font-weight-bold mb-3">En esta página podrás:</h6>
                
                <ul class="list-unstyled">
                    <li class="d-flex align-items-center mb-2">
                        <i class="fas fa-leaf text-success mr-2" style="font-size: 1.5rem;"></i>
                        <span> Cargar tus propias plantas con gran facilidad</span>
                    </li>
                    <li class="d-flex align-items-center mb-2">
                        <i class="fas fa-book text-warning mr-2" style="font-size: 1.5rem;"></i>
                        <span> Llevar un historial detallado de cada cultivo</span>
                    </li>
                    <li class="d-flex align-items-center mb-2">
                        <i class="fas fa-calendar-check text-info mr-2" style="font-size: 1.5rem;"></i>
                        <span> Programar recordatorios y tareas importantes</span>
                    </li>
                </ul>

                <div class="mt-4">
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock contenido %}
