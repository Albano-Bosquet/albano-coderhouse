{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<div class="container mt-5 pt-5">
    <div class="row justify-content-center align-items-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-lg p-4" style="background-color: #f8f9fa; border-radius: 15px;">
                <h1 class="mb-3" style="color: #1B3B1A;">Sobre mí</h1>
                <p class="lead" style="color: #333;">
                    ¡Hola! Soy Albano Bosquet, estudiante de programación en Coderhouse.
                    Apasionado por el desarrollo con Python y siempre en busca de nuevos desafíos.
                </p>
                <hr>
                <h3 class="mt-3" style="color: #1B3B1A;">Mis redes</h3>
                <div class="d-flex justify-content-center gap-3">
                    <a href="https://www.instagram.com/albano.bosquet/" class="text-dark" style="font-size: 2rem; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);" target="_blank">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/albanobosquet/" class="text-dark" style="font-size: 2rem; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);" target="_blank">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="https://github.com/Albano-Bosquet" class="text-dark" style="font-size: 2rem; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);" target="_blank">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-4 text-center">
            <img src="{% static 'img/hojas.png' %}" alt="Foto de Albano" class="img-fluid rounded-circle shadow" style="max-width: 300px;">
        </div>
    </div>
</div>
{% endblock contenido %}
